<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e17">
  <title>Mando Remoto — Open Emulator</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #141c33 0%, #070a12 80%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: env(safe-area-inset-top, 6px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 10px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      flex-wrap: wrap;
    }

    .player-picks {
      display: flex;
      gap: 6px;
    }

    .p-btn {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .p-btn.active[data-p="0"] { background: #ef4444; color: #fff; border-color: #fca5a5; }
    .p-btn.active[data-p="1"] { background: #3b82f6; color: #fff; border-color: #93c5fd; }
    .p-btn.active[data-p="2"] { background: #22c55e; color: #052e16; border-color: #86efac; }
    .p-btn.active[data-p="3"] { background: #eab308; color: #1f1600; border-color: #fde047; }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #86efac;
    }
    .status-dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .status-dot.err { color: #fca5a5; }
    .status-dot.err::before { background: #ef4444; box-shadow: none; }

    .mini-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Main Gamepad Area */
    .pad-area {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
    }

    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      max-height: 360px;
    }

    .shoulder-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .shoulder {
      min-width: 86px;
      height: 44px;
      border-radius: 14px;
      border: 2px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.85);
      color: #f8fafc;
      font-weight: 800;
      font-size: 0.95rem;
      display: grid;
      place-items: center;
    }

    .shoulder.z-btn {
      border-color: rgba(250, 204, 21, 0.55);
      background: rgba(234, 179, 8, 0.22);
      color: #fef08a;
    }

    /* Virtual Analog Stick */
    .stick-base {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 3px solid rgba(124, 92, 255, 0.45);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.6);
      display: grid;
      place-items: center;
    }

    .stick-knob {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #a78bfa, #5b21b6);
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transform: translate(0px, 0px);
      pointer-events: none;
    }

    /* Center Start / Select */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      height: 100%;
      padding-bottom: 14px;
    }

    .pill-btn {
      min-width: 82px;
      height: 38px;
      border-radius: 999px;
      border: 1.5px solid rgba(148, 163, 184, 0.4);
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      display: grid;
      place-items: center;
    }

    /* Right Face Buttons (Diamond) */
    .diamond {
      position: relative;
      width: 186px;
      height: 186px;
    }

    .face-btn {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-weight: 900;
      font-size: 1.15rem;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .btn-x { top: 0; left: 60px; background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .btn-y { top: 60px; left: 0; background: linear-gradient(135deg, #facc15, #ca8a04); color: #1f1600; }
    .btn-a { top: 60px; right: 0; background: linear-gradient(135deg, #22c55e, #15803d); }
    .btn-b { bottom: 0; left: 60px; background: linear-gradient(135deg, #ef4444, #b91c1c); }

    .pressed {
      transform: scale(0.91);
      filter: brightness(1.3);
      box-shadow: 0 0 18px rgba(0, 206, 201, 0.75);
    }

    @media (orientation: portrait) {
      .pad-area {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr auto;
      }
      .center-col {
        grid-column: 1 / -1;
        flex-direction: row;
        justify-content: center;
        height: auto;
        padding-bottom: 4px;
      }
      .stick-base { width: 145px; height: 145px; }
      .diamond { width: 162px; height: 162px; }
      .face-btn { width: 56px; height: 56px; }
      .btn-x { left: 53px; }
      .btn-y { top: 53px; }
      .btn-a { top: 53px; }
      .btn-b { left: 53px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="player-picks" role="group" aria-label="Elegir jugador">
        <button class="p-btn active" data-p="0">J1</button>
        <button class="p-btn" data-p="1">J2</button>
        <button class="p-btn" data-p="2">J3</button>
        <button class="p-btn" data-p="3">J4</button>
      </div>
      <div class="top-right">
        <span id="status-dot" class="status-dot">Conectado</span>
        <button id="btn-fs" class="mini-btn">⛶ Pantalla</button>
      </div>
    </div>

    <div class="pad-area">
      <!-- LEFT: L + Z + Analog/D-Pad Stick -->
      <div class="side">
        <div class="shoulder-row">
          <div class="shoulder" data-idx="10">L</div>
          <div class="shoulder z-btn" data-idx="12">Z / L2</div>
        </div>
        <div id="stick-base" class="stick-base">
          <div id="stick-knob" class="stick-knob"></div>
        </div>
      </div>

      <!-- CENTER: SELECT / START -->
      <div class="center-col">
        <div class="pill-btn" data-idx="2">SELECT</div>
        <div class="pill-btn" data-idx="3">START</div>
      </div>

      <!-- RIGHT: R + Diamond A/B/X/Y -->
      <div class="side">
        <div class="shoulder-row">
          <div class="shoulder" data-idx="11">R</div>
          <div class="shoulder" data-idx="13">R2 / C→</div>
        </div>
        <div class="diamond">
          <div class="face-btn btn-x" data-idx="9">X</div>
          <div class="face-btn btn-y" data-idx="1">Y</div>
          <div class="face-btn btn-a" data-idx="8">A</div>
          <div class="face-btn btn-b" data-idx="0">B</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let currentPlayer = Math.max(0, Math.min(3, (parseInt(params.get('player') || '1', 10) || 1) - 1));
    const statusDot = document.getElementById('status-dot');

    function setPlayer(p) {
      currentPlayer = p;
      document.querySelectorAll('.p-btn').forEach((b) => {
        b.classList.toggle('active', Number(b.dataset.p) === p);
      });
      pingServer();
    }

    document.querySelectorAll('.p-btn').forEach((btn) => {
      btn.addEventListener('click', () => setPlayer(Number(btn.dataset.p)));
    });

    document.getElementById('btn-fs').addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });

    // Single-in-flight coalescing queue: prevents HTTP requests from piling up
    // and causing multi-second lag when steering through an internet tunnel.
    const pendingEvents = new Map(); // idx -> latest value
    let inFlight = false;

    function queueEvents(events) {
      for (const [idx, val] of events) {
        pendingEvents.set(idx, val);
      }
      flushQueue();
    }

    async function flushQueue() {
      if (inFlight || pendingEvents.size === 0) return;
      inFlight = true;
      const batch = Array.from(pendingEvents.entries());
      pendingEvents.clear();

      try {
        const res = await fetch('./api/remote/input', {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player: currentPlayer, events: batch })
        });
        statusDot.classList.toggle('err', !res.ok);
        statusDot.textContent = res.ok ? `J${currentPlayer + 1} listo` : 'Sin conexión';
      } catch {
        statusDot.classList.add('err');
        statusDot.textContent = 'Sin conexión';
      } finally {
        inFlight = false;
        if (pendingEvents.size > 0) flushQueue();
      }
    }

    function sendEvents(events) {
      queueEvents(events);
    }

    async function pingServer() {
      try {
        const res = await fetch('./api/remote/ping', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player: currentPlayer })
        });
        statusDot.classList.toggle('err', !res.ok);
        statusDot.textContent = res.ok ? `J${currentPlayer + 1} listo` : 'Sin conexión';
      } catch {
        statusDot.classList.add('err');
        statusDot.textContent = 'Sin conexión';
      }
    }

    // Bind digital buttons with multi-touch Pointer Events
    document.querySelectorAll('[data-idx]').forEach((el) => {
      const idx = Number(el.dataset.idx);
      const activePointers = new Set();

      const press = (e) => {
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        if (activePointers.size === 0) {
          el.classList.add('pressed');
          if (navigator.vibrate) navigator.vibrate(12);
          sendEvents([[idx, 1]]);
        }
        activePointers.add(e.pointerId);
      };

      const release = (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.delete(e.pointerId);
        if (activePointers.size === 0) {
          el.classList.remove('pressed');
          sendEvents([[idx, 0]]);
        }
      };

      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
    });

    // Virtual Stick -> sends BOTH Analog Left Stick (16..19 for N64) AND D-Pad (4..7 for SNES/NES/GBA)
    const stickBase = document.getElementById('stick-base');
    const stickKnob = document.getElementById('stick-knob');
    let stickPointerId = null;
    let lastStickState = { up: 0, down: 0, left: 0, right: 0, axR: 0, axL: 0, axD: 0, axU: 0 };
    let lastStickSend = 0;

    function updateStick(clientX, clientY, force = false) {
      const rect = stickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = rect.width * 0.36;

      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }

      stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

      const nx = dx / maxR; // -1..1
      const ny = dy / maxR; // -1..1
      const dead = 0.22;

      const next = {
        up: ny < -dead ? 1 : 0,
        down: ny > dead ? 1 : 0,
        left: nx < -dead ? 1 : 0,
        right: nx > dead ? 1 : 0,
        axR: nx > dead ? Math.round(nx * 32767) : 0,
        axL: nx < -dead ? Math.round(-nx * 32767) : 0,
        axD: ny > dead ? Math.round(ny * 32767) : 0,
        axU: ny < -dead ? Math.round(-ny * 32767) : 0
      };

      const now = performance.now();
      if (!force && now - lastStickSend < 60) return;

      const events = [];
      if (next.up !== lastStickState.up) events.push([4, next.up]);
      if (next.down !== lastStickState.down) events.push([5, next.down]);
      if (next.left !== lastStickState.left) events.push([6, next.left]);
      if (next.right !== lastStickState.right) events.push([7, next.right]);
      if (Math.abs(next.axR - lastStickState.axR) > 3500 || (next.axR === 0 && lastStickState.axR !== 0)) events.push([16, next.axR]);
      if (Math.abs(next.axL - lastStickState.axL) > 3500 || (next.axL === 0 && lastStickState.axL !== 0)) events.push([17, next.axL]);
      if (Math.abs(next.axD - lastStickState.axD) > 3500 || (next.axD === 0 && lastStickState.axD !== 0)) events.push([18, next.axD]);
      if (Math.abs(next.axU - lastStickState.axU) > 3500 || (next.axU === 0 && lastStickState.axU !== 0)) events.push([19, next.axU]);

      if (events.length > 0) {
        lastStickState = next;
        lastStickSend = now;
        sendEvents(events);
      }
    }

    function resetStick() {
      stickKnob.style.transform = 'translate(0px, 0px)';
      lastStickState = { up: 0, down: 0, left: 0, right: 0, axR: 0, axL: 0, axD: 0, axU: 0 };
      sendEvents([[4, 0], [5, 0], [6, 0], [7, 0], [16, 0], [17, 0], [18, 0], [19, 0]]);
    }

    stickBase.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      stickPointerId = e.pointerId;
      stickBase.setPointerCapture(e.pointerId);
      updateStick(e.clientX, e.clientY, true);
    });
    stickBase.addEventListener('pointermove', (e) => {
      if (e.pointerId !== stickPointerId) return;
      updateStick(e.clientX, e.clientY, false);
    });
    const endStick = (e) => {
      if (e.pointerId !== stickPointerId) return;
      stickPointerId = null;
      resetStick();
    };
    stickBase.addEventListener('pointerup', endStick);
    stickBase.addEventListener('pointercancel', endStick);

    setPlayer(currentPlayer);
    setInterval(pingServer, 8000);
  </script>
</body>
</html>
